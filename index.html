    <!-- Recuperação do domínio: remove uma única vez Service Workers e caches
         deixados por hospedagens antigas. O worker atual do SendPulse é
         preservado para não cancelar notificações já autorizadas. -->
    <script>
      (function () {
        var recoveryKey = "inovapro3d-origin-recovery-v1";
        var productionHosts = ["inovapro3d.com.br", "www.inovapro3d.com.br"];
        if (productionHosts.indexOf(window.location.hostname) === -1) return;
        try {
          if (window.localStorage.getItem(recoveryKey) === "done") return;
        } catch (_) {
          // A limpeza continua mesmo quando o navegador bloqueia o armazenamento.
        }

        var removeOldWorkers = Promise.resolve();
        if ("serviceWorker" in navigator) {
          removeOldWorkers = navigator.serviceWorker
            .getRegistrations()
            .then(function (registrations) {
              return Promise.all(
                registrations.map(function (registration) {
                  var workers = [
                    registration.installing,
                    registration.waiting,
                    registration.active,
                  ];
                  var isCurrentPushWorker = workers.some(function (worker) {
                    if (!worker) return false;
                    try {
                      return new URL(worker.scriptURL).pathname === "/sp-push-worker-fb.js";
                    } catch (_) {
                      return false;
                    }
                  });
                  return isCurrentPushWorker ? false : registration.unregister();
                }),
              );
            })
            .catch(function () {});
        }

        var clearOldCaches = Promise.resolve();
        if ("caches" in window) {
          clearOldCaches = caches
            .keys()
            .then(function (names) {
              return Promise.all(
                names.map(function (name) {
                  return caches.delete(name);
                }),
              );
            })
            .catch(function () {});
        }

        Promise.all([removeOldWorkers, clearOldCaches]).then(function () {
          try {
            window.localStorage.setItem(recoveryKey, "done");
          } catch (_) {}
        });
      })();
    </script>

    <!-- Anti-flash: aplica dark antes de qualquer paint -->
    <script>
      (function () {
        var t = localStorage.getItem("inovapro3d-theme");
        document.documentElement.classList.add(t === "light" ? "light" : "dark");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      })();
    </script>

    <!-- O primeiro paint usa a pilha de fontes do sistema. Isso evita que uma

    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INOVA PRO 3D — Impressão 3D Profissional" />

    <!-- SendPulse Web Push. Inline (não atrás do consentimento de cookies): o
         verificador do SendPulse lê o HTML cru e não executa JS. O próprio
         navegador pede permissão ("Permitir notificações?") antes de qualquer
         coleta, servindo de consentimento explícito. -->
    <script
      charset="UTF-8"
      src="//web.webpushs.com/js/push/c645b41ef74d093572934565b95d5a28_1.js"
      async
    ></script>
  </head>
  <body>
    <style>
      html{background:#020617;color:#f8fafc;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;background:#020617}.initial-shell{position:fixed;inset:0;z-index:9999;min-height:100vh;overflow:hidden;background:#020617;pointer-events:none}.initial-nav{height:64px;display:flex;align-items:center;padding:0 24px;font-weight:900;letter-spacing:.08em}.initial-hero{box-sizing:border-box;min-height:520px;padding:64px max(24px,calc((100vw - 1280px)/2 + 32px));background:radial-gradient(ellipse at 50% 0%,rgba(99,179,237,.1),transparent 55%)}.initial-hero h1{max-width:900px;margin:0;min-height:120px;text-transform:uppercase;line-height:1.02}.initial-kicker{display:block;margin-bottom:6px;color:rgba(255,255,255,.6);font-size:clamp(22px,3.4vw,40px);letter-spacing:.025em}.initial-accent{display:block;color:#93c5fd;font-size:clamp(38px,6vw,96px);font-weight:900}.initial-copy{max-width:672px;min-height:72px;margin:24px 0 0;color:rgba(255,255,255,.7);font-size:18px;line-height:1.65}.initial-tags{margin-top:20px;color:#cbd5e1;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.initial-actions{display:flex;gap:12px;margin-top:36px}.initial-actions a{min-height:60px;display:inline-flex;align-items:center;padding:0 28px;border-radius:16px;background:#fff;color:#0f172a;font-size:13px;font-weight:900;letter-spacing:.12em;text-decoration:none;text-transform:uppercase}@media(max-width:639px){.initial-nav{padding:0 20px}.initial-hero{min-height:570px;padding:54px 24px 32px}.initial-copy{font-size:16px}.initial-actions a{width:100%;box-sizing:border-box;justify-content:center}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    </style>
    <div class="initial-shell" id="initial-shell">
        <div class="initial-nav">INOVA PRO 3D</div>
        <main class="initial-hero">
          <h1><span class="initial-kicker">Você imagina.</span><span class="initial-accent">A gente imprime.</span></h1>
          <p class="initial-copy">Da ideia à peça na sua mesa. Escolha no catálogo ou envie seu projeto — a gente cuida do resto.</p>
          <div class="initial-tags">Catálogo &nbsp; · &nbsp; Sob encomenda &nbsp; · &nbsp; Envio Brasil</div>
          <div class="initial-actions"><a href="/catalogo">Ver o catálogo</a></div>
        </main>
    </div>
    <script>if(location.pathname!=="/")document.getElementById("initial-shell").style.display="none"</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
