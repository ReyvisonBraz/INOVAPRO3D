name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# O job só instala dependências e roda checagens — não precisa escrever no
# repositório. Sem esta declaração o GITHUB_TOKEN herda o padrão da conta, que
# em repositórios mais antigos é leitura e escrita.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
